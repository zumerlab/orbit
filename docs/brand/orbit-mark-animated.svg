<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104" fill="none" stroke="currentColor" stroke-width="8" color="#0abdf6" role="img" aria-labelledby="orbit-brand-title">
  <title id="orbit-brand-title">Orbit</title>
  <style>
    .orbit-brand-satellite,.orbit-brand-inner { transform-origin:52px 52px }
    .orbit-brand-satellite { animation:orbit-brand-drift 4.8s ease-in-out 1 }
    .orbit-brand-inner { animation:orbit-brand-counterturn 4.8s ease-in-out 1 }
    @keyframes orbit-brand-drift { 0%,100% { transform:rotate(0deg) } 50% { transform:rotate(14deg) } }
    @keyframes orbit-brand-counterturn { 0%,100% { transform:rotate(0deg) } 50% { transform:rotate(-10deg) } }
    @media (prefers-reduced-motion:reduce) { .orbit-brand-satellite,.orbit-brand-inner { animation:none } }
  </style>
  <path d="M52 9a43 43 0 1 1-43 43"/>
  <path class="orbit-brand-inner" d="M52 29a23 23 0 1 0 23 23"/>
  <g class="orbit-brand-satellite"><circle cx="21.594" cy="21.594" r="6.5" fill="currentColor" stroke="none"/></g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>06 — Battery | Orbit</title>
  <link rel="stylesheet" href="../dist/orbit.css" />
  <script src="../dist/orbit.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; }
    .demo { width: 200px; aspect-ratio: 2/1; }
    .demo .satellite { border: none; }
    .demo o-arc { --o-stroke: none; --o-fill: #22c55e; }
    .demo .capsule { font: 800 20px/1 system-ui; color: #22c55e; }
    .demo .capsule.label { translate: 0 -70%; }
    .ring { filter: drop-shadow(0 0 20px rgba(34,197,94,.2)); }
    .doc { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: #0a0a0a; color: #525252; font: 13px/1.5 system-ui; border-top: 1px solid #262626; }
    .doc code { color: #22c55e; }
  </style>
</head>
<body>
  <div class="demo bigbang ring at-bottom">
    <div class="gravity-spot" style="--o-force: 100cqw">
      <div class="orbit-10 range-180 from-270" style="--o-size-ratio: 2">
        <o-arc id="gauge" value="84" shape="arrow" style="--o-fill:#22c55e"></o-arc>
      </div>
      <div class="orbit-0">
        <div class="satellite at-center"><div class="capsule label"><span id="val">84</span>%</div></div>
      </div>
    </div>
  </div>
  <input id="rng" type="range" min="0" max="100" value="84" style="position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:160px;accent-color:#22c55e">

  <div class="doc">
    <a href="./">← All demos</a> · <strong>06 — Battery</strong> · A 2:1 universe with its center at the bottom (<code>.at-bottom</code>). <code>--o-force: 100cqw</code> makes the reach the width, so the half ring spans the box.
  </div>

  <script>
    const r=document.getElementById('rng'), g=document.getElementById('gauge'), v=document.getElementById('val');
    r.oninput=()=>{ const x=r.value; g.setAttribute('value',x); v.textContent=x; };
  </script>
</body>
</html>

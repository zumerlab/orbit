<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>03 — Quick Actions | Orbit</title>
  <link rel="stylesheet" href="https://unpkg.com/@zumer/orbit@latest/dist/orbit.css" />
  <script src="https://unpkg.com/@zumer/orbit@latest/dist/orbit.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; }
    .demo { width: 300px; aspect-ratio: 1; }
    .demo .satellite { border: none; }
    .demo .capsule { font-weight: 800; font-size: 12px; letter-spacing: .08em; color: #f8fafc; }
    o-arc { cursor: pointer; transition: transform .12s ease, filter .12s; }
    o-arc:hover { transform: scale(1.05); filter: brightness(1.15); }
    o-arc:active { transform: scale(.98); }
    .ring { filter: drop-shadow(0 0 30px rgba(59,130,246,.15)); }
    .doc { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: #020617; color: #64748b; font: 13px/1.5 system-ui; border-top: 1px solid #1e293b; }
    .doc code { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="demo bigbang ring">
    <div class="gravity-spot">
      <div class="orbit-5 fit-range range-270 from-225">
        <o-arc class="gap-6" style="--o-fill:#3b82f6"></o-arc>
        <o-arc class="gap-6" style="--o-fill:#10b981"></o-arc>
        <o-arc class="gap-6" style="--o-fill:#f59e0b"></o-arc>
        <o-arc class="gap-6" style="--o-fill:#ef4444"></o-arc>
      </div>
      <div class="orbit-0">
        <div class="satellite at-center"><div class="capsule" id="label">MENU</div></div>
      </div>
    </div>
  </div>

  <div class="doc">
    <strong>03 — Quick actions</strong> · Direction-based selection. Large wedges = easy targets (Fitts's law).
  </div>

  <script>
    const actions = ['HOME','NEW','EDIT','DELETE'];
    document.querySelectorAll('.demo o-arc').forEach((a,i)=>{ a.addEventListener('click', ()=> document.getElementById('label').textContent = actions[i]); });
  </script>
</body>
</html>

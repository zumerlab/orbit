<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../dist/orbit.css">
  <title>Orbit dashboard</title>
  <style>
    body {
      background-color: black; 
      font-weight: lighter;
      font-size: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      --fx-color: var(--o-blue);
      --fx-font: var(--o-blue);
      
      
    }

    .fx-icon-main {
      display: none;
    }
    .eco {
      --fx-color: var(--o-green);
      --fx-font: green;

      .fx-icon-main {
        display: block;
      }
      .eye-info{
        display: none;
      }
    }

    .armed {
      --fx-color: red;
      --fx-font: red;

      
    }

    .satellite {
      border: none;
    }

    .ring {
      border-width: 2px;
      border-style: solid;
    }
    .ring.glow-blue {
      border-color: var(--fx-color);
    }
    .ring.bold {
      border-width: 3px;
    }

    .vector.glow-blue {
      background-color: var(--fx-color);
    }
    .satellite.glow-blue {
      border: none;
      color: var(--fx-color);
    }
    .satellite.glow-blue .capsule{
      width: fit-content;
      padding: 2px;
      border: 1px solid var(--fx-font);
      border: none;
      border-radius: 5px;
    }
    o-arc.transparent {
      --o-fill: none
    }
    
    o-arc.glow-blue {
      --o-fill: var(--fx-color);
    }
    
   
    .translucid {
      opacity: 0.5;
    }

    .NOeye {
      background: radial-gradient(ellipse at center, orange 0%, orange 1%, red 25%, black 65%, black 100%);
    }
    .eye-info {
      width: 200px; text-align: center; color: var(--fx-font); flex-direction: column;
    }

    .emphasis {
       font-weight: bold; font-size: 20px
    }
    .mode-label {
      font-weight: bold;
    }
    .selector {
      opacity: 0;
      color: var(--fx-font); fill-opacity: 0.1; --o-fill: var(--fx-color); --o-stroke: var(--fx-color);
      
    }
    .selector:hover {
      transition: opacity 1s;
      opacity: 1;
      cursor: pointer;
      color: var(--fx-font); fill-opacity: 0.1; --o-fill: var(--fx-color); --o-stroke: var(--fx-color);
    }
    .label {
      color: var(--fx-font)
    }
    .numpad {
      display: flex;
      width: 210px;
    }
    .numpad span {
      text-align: center;
      padding: 10px;
      margin: 5px;
      border: 2px solid var(--o-blue);
      height: 60px;
      width: 60px;
      border-radius: 50%;
    }
    .alarm-code {
      text-align: center;
      padding: 10px;
      margin: 5px;
      border: 2px solid var(--o-blue);
      height: 60px;
      width: 200px;
      border-radius: 8px;
    }
    .arm {
      border: 2px solid var(--o-pink);
      color: var(--o-pink)
    }
  </style>
</head>
